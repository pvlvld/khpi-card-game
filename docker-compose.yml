services:
  db:
    container_name: acehole_db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: 'card_game'
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./postgres:/var/lib/postgresql/data
